# MLS tmux status theme.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0e0e0e,fg=#b2b2b2"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#0e0e0e,bg=#c9a470,bold] #S #[fg=#c9a470,bg=#0e0e0e] "
set -g window-status-format "#[fg=#585d76,bg=#0e0e0e] #I:#W "
set -g window-status-current-format "#[fg=#c8c8c8,bg=#1a1a1a,bold] #I:#W #[fg=#c9a470]*"
set -g window-status-separator ""
set -g status-right "#[fg=#585d76]%Y-%m-%d #[fg=#1a1a1a]│ #[fg=#b2b2b2]%H:%M "

set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#c9a470"
set -g message-style "bg=#1a1a1a,fg=#c8c8c8,bold"
set -g message-command-style "bg=#1a1a1a,fg=#c8c8c8,bold"
setw -g mode-style "bg=#383838,fg=#c8c8c8"
setw -g clock-mode-colour "#c9a470"
