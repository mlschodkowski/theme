# Nordic MLS tmux status theme, derived from AlexvZyl/nordic.nvim.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#242933,fg=#BBC3D4"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#242933,bg=#D08770,bold] #S #[fg=#D08770,bg=#242933] "
set -g window-status-format "#[fg=#60728A,bg=#242933] #I:#W "
set -g window-status-current-format "#[fg=#D8DEE9,bg=#1E222A,bold] #I:#W #[fg=#D08770]*"
set -g window-status-separator ""
set -g status-right "#[fg=#60728A]%Y-%m-%d #[fg=#1E222A]│ #[fg=#BBC3D4]%H:%M "

set -g pane-border-style "fg=#1E222A"
set -g pane-active-border-style "fg=#D08770"
set -g message-style "bg=#1E222A,fg=#D8DEE9,bold"
set -g message-command-style "bg=#1E222A,fg=#D8DEE9,bold"
setw -g mode-style "bg=#434C5E,fg=#D8DEE9"
setw -g clock-mode-colour "#D08770"
