# Carbon theme adapted from rishikanthc/carbon-helix.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#161616,fg=#a8a8a8"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#161616,bg=#4589ff,bold] #S #[fg=#4589ff,bg=#161616] "
set -g window-status-format "#[fg=#6f6f6f,bg=#161616] #I:#W "
set -g window-status-current-format "#[fg=#f4f4f4,bg=#262626,bold] #I:#W #[fg=#82cfff]*"
set -g window-status-separator ""
set -g status-right "#[fg=#6f6f6f]%Y-%m-%d #[fg=#525252]│ #[fg=#a8a8a8]%H:%M "

set -g pane-border-style "fg=#393939"
set -g pane-active-border-style "fg=#4589ff"
set -g message-style "bg=#262626,fg=#c8ccd4,bold"
set -g message-command-style "bg=#262626,fg=#c8ccd4,bold"
setw -g mode-style "bg=#393939,fg=#f4f4f4"
setw -g clock-mode-colour "#82cfff"
